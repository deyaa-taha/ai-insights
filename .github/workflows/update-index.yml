name: Update index

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "posts/**"
      - "scripts/build_index.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README index and feed.xml
        run: |
          pip install pyyaml
          python scripts/build_index.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md feed.xml; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md feed.xml
          git commit -m "chore: update index [skip ci]"
          git push
